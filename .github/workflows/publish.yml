name: publish

# Tag-driven releases. The job stages the tarball; approving it is the 2FA
# step, done in the npm web UI where 2FA works. Authentication is OIDC trusted
# publishing - no NPM_TOKEN, no expiry, nothing to rotate.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC + provenance

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Node 22 ships npm 10; `npm stage` and OIDC trusted publishing need 12.
      - name: Upgrade npm
        run: npm install -g npm@12

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check

      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          }

      - name: Stage the release
        run: npm stage publish --access public

      - name: Where to approve
        if: success()
        run: |
          {
            echo "### Release staged"
            echo ""
            echo "Approve it in the npm web UI with browser 2FA:"
            echo "https://www.npmjs.com/package/opencode-crosstalk"
            echo ""
            echo "Staged versions cannot be listed or approved with an OIDC token - approval is"
            echo "proof-of-presence and always needs the browser or a CLI OTP."
          } >> "$GITHUB_STEP_SUMMARY"
